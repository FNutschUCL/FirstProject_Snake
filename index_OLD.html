<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Snake Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main>
    <header>
      <h1>Snake</h1>
      <p class="score-line">Score: <span id="score">0</span></p>
    </header>

    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div id="overlay">
        <p id="overlay-text">Press any arrow key to start</p>
      </div>
    </div>

    <footer>
      <p>Use the arrow keys to move.</p>
      <p class="hint">This is your game now — try changing something in <code>game.js</code>.</p>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
